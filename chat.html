<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- SEC-02 CSP：与 index.html 同标准（style 行内仅因现存行内 style 属性） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
  <title>对话</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 对话窗（v1.0 方案二）：无边框深色窗 —— 实底避透明窗 DWM 坑，标题栏系统级拖拽 */
    /* 对话窗（深空冰蓝微光质感）：深空暗底 + 冰蓝半透微光 + 呼吸动效 */
    html, body {
      margin: 0;
      height: 100%;
      background: #0f121d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    #chatPage {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(26, 32, 54, 0.95) 0%, rgba(13, 16, 26, 0.98) 100%);
      color: #e6ebf3;
      /* 不加 backdrop-filter：本窗是实底（transparent:false），它糊到的只是同色底，
         视觉零收益却要付整窗合成开销（毛玻璃减负先例见 style.css 拖拽期卸毛玻璃）。 */
    }
    #chatHead {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 13px;
      color: #cfd6e4;
      user-select: none;
      border-bottom: 1px solid rgba(135, 175, 255, 0.12);
      -webkit-app-region: drag;
      cursor: grab;
      background: rgba(18, 22, 36, 0.6);
    }
    #chatHead:active { cursor: grabbing; }
    #chatTitle {
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e2e8f6;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #chatTitle::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #70a1ff;
      box-shadow: 0 0 8px #70a1ff;
    }
    .chat-head-tools { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
    .chat-tool-btn {
      background: none;
      border: none;
      color: #8fa0bd;
      font-size: 13px;
      cursor: pointer;
      padding: 3px 6px;
      line-height: 1;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .chat-tool-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }
    #chatClose { font-size: 14px; }
    #chatClose:hover { background: rgba(231, 76, 60, 0.2); color: #ff8b8b; }
    #chatList {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px;
    }
    #chatList::-webkit-scrollbar { width: 4px; }
    #chatList::-webkit-scrollbar-track { background: transparent; }
    #chatList::-webkit-scrollbar-thumb {
      background: rgba(140, 175, 255, 0.18);
      border-radius: 4px;
      transition: background 0.2s;
    }
    #chatList::-webkit-scrollbar-thumb:hover { background: rgba(140, 175, 255, 0.38); }
    /* v1.0 用户整容：头像升至消息框上方；时间贴框下、右对齐、不出框（双方同款） */
    .b-row {
      display: flex;
      gap: 9px;
      margin: 6px 0;
      align-items: flex-start;
      animation: bubbleFadeIn 0.18s ease-out;
    }
    @keyframes bubbleFadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }
    .b-av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      user-select: none;
    }
    .b-ai .b-av {
      background: linear-gradient(135deg, #2b395a 0%, #1a2238 100%);
      color: #cde0ff;
      border: 1px solid rgba(140, 190, 255, 0.4);
      box-shadow: 0 0 10px rgba(112, 161, 255, 0.2);
    }
    .b-user .b-av {
      background: linear-gradient(135deg, #24344d 0%, #162030 100%);
      color: #bfd4f5;
      border: 1px solid rgba(120, 160, 220, 0.28);
    }
    .b-col { max-width: 80%; display: flex; flex-direction: column; }
    .b-user { flex-direction: row-reverse; }
    .b-user .b-col { align-items: flex-end; }
    .b-text {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.58;
      white-space: pre-wrap;
      word-break: break-word;
      letter-spacing: 0.01em;
    }
    .b-ai .b-text {
      background: rgba(28, 34, 52, 0.85);
      color: #e4eaf6;
      border: 1px solid rgba(135, 175, 255, 0.16);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
      border-top-left-radius: 4px;
    }
    .b-user .b-text {
      background: linear-gradient(135deg, #325088 0%, #283e6b 100%);
      color: #f0f5ff;
      border: 1px solid rgba(150, 195, 255, 0.32);
      box-shadow: 0 3px 14px rgba(35, 60, 110, 0.4);
      border-top-right-radius: 4px;
    }
    .b-note { justify-content: center; }
    .b-note .b-text {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      color: #8ea1cb;
      font-size: 11.5px;
      padding: 4px 12px;
      border-radius: 8px;
      text-align: center;
    }
    .b-bridged { opacity: .6; }
    .b-ts {
      margin-top: 3px;
      font-size: 10px;
      color: #697690;
      letter-spacing: 0.02em;
      text-align: right;
    }
    .b-bedside-note { color: #8fa0b8; font-style: italic; }
    .b-pending .b-text { opacity: .7; }
    .b-streaming .b-text::after {
      content: '▍';
      color: #70a1ff;
      text-shadow: 0 0 8px rgba(112, 161, 255, 0.8);
      animation: streamPulse 0.8s steps(2) infinite;
      margin-left: 2px;
    }
    @keyframes streamPulse { 50% { opacity: 0; } }
    .b-error .b-text {
      border: 1px solid #d63031;
      background: rgba(214, 48, 49, 0.12);
      color: #ff7675;
    }
    .win-divider {
      text-align: center;
      color: #6a7791;
      font-size: 10.5px;
      margin: 12px 0 8px;
      letter-spacing: 0.05em;
    }
    #inputBar {
      flex: none;
      display: flex;
      gap: 9px;
      padding: 12px 14px 8px;
      border-top: 1px solid rgba(135, 175, 255, 0.12);
      background: rgba(14, 17, 27, 0.85);
      align-items: flex-end;
    }
    #input {
      flex: 1;
      min-width: 0;
      background: rgba(22, 27, 42, 0.75);
      border: 1px solid rgba(135, 175, 255, 0.2);
      border-radius: 10px;
      padding: 9px 12px;
      color: #f0f4fc;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      resize: none;
      line-height: 1.45;
      max-height: 100px;
      overflow-y: auto;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    #input::placeholder { color: #697897; }
    #input:focus {
      border-color: rgba(120, 175, 255, 0.7);
      background: rgba(25, 32, 50, 0.9);
      box-shadow: 0 0 14px rgba(100, 160, 255, 0.22);
    }
    #send {
      flex: none;
      width: 38px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(150, 195, 255, 0.3);
      background: linear-gradient(135deg, #4865c8 0%, #364fa0 100%);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(45, 70, 150, 0.35);
      transition: all 0.2s ease;
    }
    #send:hover {
      background: linear-gradient(135deg, #5775de 0%, #425cb4 100%);
      box-shadow: 0 0 14px rgba(112, 161, 255, 0.5);
      transform: translateY(-1px);
    }
    #send:active { transform: translateY(1px); }
    #send:disabled {
      opacity: .45;
      cursor: default;
      transform: none;
      box-shadow: none;
      background: #3a4560;
      border-color: rgba(255, 255, 255, 0.1);
    }
    /* 提示行独立成带：贴窗底居中，与输入条留出呼吸（v1.0 用户反馈：太紧凑） */
    .chat-foot {
      flex: none;
      padding: 4px 14px 12px;
      text-align: center;
      font-size: 11px;
      color: #63718c;
      margin: 0;
      word-break: keep-all;
    }

    /* ---------------- v1.8-b：待发送截图预览条 ----------------
       🔴 为什么必须有这条：用户实测「截出来的图在对话框里找不到、
          也不会出现在输入框里，具有迷惑性」。截图存进 brain 后
          界面零反馈 —— 他无法确认到底截到了没有。
       这条给出三个确定信息：缩略图（截到了什么）、尺寸、可移除。 */
    #visionBar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-top: 1px solid rgba(135, 175, 255, 0.12);
      background: rgba(22, 28, 44, 0.72);
    }
    #visionBar.hidden { display: none; }
    #visionThumb {
      width: 56px; height: 42px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(135, 175, 255, 0.32);
      background: rgba(0, 0, 0, .3);
      flex: none;
    }
    #visionMeta {
      flex: 1;
      min-width: 0;
      font-size: 11.5px;
      color: #9fb4d8;
      line-height: 1.45;
    }
    #visionDrop {
      flex: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: #cfd8ea;
      font-size: 13px; line-height: 1;
      cursor: pointer;
    }
    #visionDrop:hover { background: rgba(231, 76, 60, .28); color: #ff9b9b; }
  </style>
</head>
<body>
  <div id="chatPage">
    <div id="chatHead">
      <span id="chatTitle">对话</span>
      <div class="chat-head-tools">
        <button id="chatClose" class="chat-tool-btn" title="关闭 (ESC)">✕</button>
      </div>
    </div>
    <div id="chatList"></div>
    <!-- v1.8-b：待发送的截图预览条。
         🔴 用户实测反馈：「截出来的图在对话框里找不到，也不会出现在输入框里，具有迷惑性」。
         截图存进 brain 后界面上完全看不到 —— 用户无法确认"到底截到没有"。
         这条让你看见：缩略图 + 尺寸 + 可移除。发出去或点 × 后消失。 -->
    <div id="visionBar" class="hidden">
      <img id="visionThumb" alt="">
      <span id="visionMeta">—</span>
      <button id="visionDrop" title="移除这张图">×</button>
    </div>
    <div id="inputBar">
      <!-- v1.7-a：语音输入按钮。默认 disabled —— 未配置 STT 服务时不可点，
           配置存在才亮起（由 chat.js 的 syncMicState 驱动）。 -->
      <button id="micBtn" class="mic-btn" disabled title="未配置语音识别服务">🎤</button>
      <textarea id="input" rows="1" spellcheck="false" autocomplete="off" maxlength="2000"></textarea>
      <button id="send" title="发送">↑</button>
    </div>
    <div class="hint chat-foot" id="chatHint"></div>
  </div>
  <script src="ui-i18n.js"></script>
  <script src="ui-chat-store.js"></script>
  <script src="ui-chat-render.js"></script>
  <script src="chat.js"></script>
</body>
</html>
