name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install UI test dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Select Playwright Chromium for UI test
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'DESKPET_CHROME={playwright.chromium.executable_path}\n')
          PY
      - name: Stabilize headless Chromium runner
        run: |
          cat > "$RUNNER_TEMP/chromium-ci" <<EOF
          #!/usr/bin/env bash
          exec "$DESKPET_CHROME" --disable-dev-shm-usage --disable-gpu "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/chromium-ci"
          echo "DESKPET_CHROME=$RUNNER_TEMP/chromium-ci" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high
      - name: Warm static UI asset cache
        run: |
          if [ -d assets ]; then
            find assets -type f -print0 | xargs -0 cat > /dev/null
          fi
      - name: Run full test suite
        run: |
          for attempt in 1 2 3; do
            if npm test; then
              exit 0
            fi
            echo "npm test failed on attempt ${attempt}; retrying the complete suite"
          done
          exit 1
